backend:
  name: github
  repo: Maoxin1/mantou-blog
  branch: main
  base_url: https://decap-proxy.xmiao2343.workers.dev
  auth_endpoint: /auth
  squash_merges: true

publish_mode: editorial_workflow
site_url: https://mantou-blog.pages.dev
display_url: https://mantou-blog.pages.dev

media_folder: "static/images/posts"
public_folder: "/images/posts"

collections:
  - name: "posts"
    label: "历史日记与文章"
    description: "仅写入随笔档案；新的阶段性作品请从“作品集”创建。"
    folder: "content/posts"
    create: true
    slug: "{{fields.date}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "摘要", name: "description", widget: "text", required: false }
      - { label: "内容归档", name: "categories", widget: "hidden", default: ["essays"] }
      - label: "标签"
        name: "tags"
        widget: "select"
        multiple: true
        required: false
        options:
          - "成长反思"
          - "生活随笔"
          - "投资理财"
          - "工作职场"
          - "AI"
          - "写作博客"
          - "健康"
      - label: "Body"
        name: "body"
        widget: "markdown"

  - name: "weight"
    label: "体重记录"
    files:
      - name: "weight_log"
        label: "每周体重"
        file: "data/weight.yaml"
        fields:
          - label: "每周记录"
            name: "entries"
            label_singular: "一周"
            widget: "list"
            summary: "{{fields.date}} · {{fields.weight}}kg · BMI {{fields.bmi}}"
            fields:
              - { label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
              - { label: "体重(kg)", name: "weight", widget: "number", value_type: "float", step: 0.1 }
              - { label: "BMI", name: "bmi", widget: "number", value_type: "float", step: 0.1 }

  - name: "works"
    label: "作品集"
    description: "保存草稿会创建PR；等待validate通过并完成公开边界复核后再发布。"
    folder: "content/works"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "完成日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "摘要", name: "description", widget: "text" }
      - label: "作品类型"
        name: "work_type"
        widget: "select"
        options:
          - { label: "投资研究", value: "investment" }
          - { label: "工具产品", value: "tools" }
          - { label: "方法论", value: "methodology" }
          - { label: "身体实践", value: "body" }
      - { label: "阶段", name: "stage", widget: "string", default: "V1 · 已完成" }
      - { label: "要解决的问题", name: "problem", widget: "text", hint: "说明真实问题，不写泛泛愿景。" }
      - { label: "待验证的假设", name: "hypothesis", widget: "text", hint: "开始前认为哪项改变会解决问题？" }
      - { label: "约束与边界", name: "constraints", widget: "text", hint: "记录时间、成本、隐私和功能边界。" }
      - { label: "关键决策", name: "decision", widget: "text", hint: "说明做了什么取舍，以及为何这样选择。" }
      - { label: "阶段结果", name: "outcome", widget: "text" }
      - { label: "成品链接", name: "artifact_url", widget: "string", required: false }
      - { label: "源码或补充链接", name: "source_url", widget: "string", required: false }
      - { label: "验证证据", name: "evidence", widget: "text" }
      - { label: "限制与不足", name: "limitations", widget: "text" }
      - { label: "下一步判断", name: "next_step", widget: "text", hint: "明确继续、调整或停止的依据。" }
      - label: "公开边界"
        name: "disclosure"
        widget: "select"
        options:
          - { label: "完整公开", value: "public" }
          - { label: "匿名处理", value: "anonymized" }
          - { label: "延迟公开", value: "delayed" }
        default: "public"
      - label: "投资隐私复核完成"
        name: "privacy_reviewed"
        widget: "select"
        required: false
        options:
          - { label: "已完成", value: "true" }
        hint: "投资作品发布前必须开启：确认未公开金额、仓位、账户总收益；具体标的已达到阶段复盘或完全退出的公开时点。"
      - label: "具体标的公开依据"
        name: "security_disclosure_basis"
        widget: "select"
        required: false
        options:
          - { label: "未公开具体标的", value: "not_named" }
          - { label: "已达到公开边界", value: "boundary_met" }
        hint: "投资作品必填。达到公开边界指已经进入阶段复盘，或已经完全退出；无需公开具体属于哪一种。"
      - { label: "首页精选", name: "featured", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }
