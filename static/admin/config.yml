backend:
  name: github
  repo: Maoxin1/mantou-blog
  branch: main
  base_url: https://decap-proxy.xmiao2343.workers.dev
  auth_endpoint: /auth
  squash_merges: true

publish_mode: editorial_workflow
site_url: https://mantou-blog.pages.dev
display_url: https://mantou-blog.pages.dev

media_folder: "static/images/posts"
public_folder: "/images/posts"

collections:
  - name: "posts"
    label: "历史日记与文章"
    description: "日记与文章；新作品从“作品集”创建。正式发布需要同步英文译文。"
    folder: "content/posts"
    create: true
    slug: "{{fields.date}}-{{fields.slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - label: "分享短链接"
        name: "slug"
        widget: "string"
        pattern: ["^(?=.{1,32}$)[a-z0-9]+(?:-[a-z0-9]+)*$", "使用不超过 32 个小写英文字母、数字和连字符，例如 memory-sector-review"]
        hint: "决定公开网址；简短、可读，发布后不要随意修改。"
      - { label: "摘要", name: "description", widget: "text", required: false }
      - { label: "内容归档", name: "categories", widget: "hidden", default: ["essays"] }
      - label: "标签"
        name: "tags"
        widget: "select"
        multiple: true
        required: false
        options:
          - "成长反思"
          - "生活随笔"
          - "投资理财"
          - "工作职场"
          - "AI"
          - "写作博客"
          - "健康"
      - label: "Body"
        name: "body"
        widget: "markdown"

  - name: "now"
    label: "当前下注"
    description: "只保留当前真正投入注意力的 1–3 个方向；增加一项前，先判断它是否值得挤掉已有的一项。"
    files:
      - name: "now"
        label: "当前在做什么"
        file: "content/now.md"
        fields:
          - { label: "页面标题", name: "title", widget: "hidden", default: "当前在做什么" }
          - { label: "页面摘要", name: "description", widget: "hidden", default: "我当前真正投入注意力的少数方向，以及下一次重新判断的检查点。" }
          - { label: "内容类型", name: "type", widget: "hidden", default: "now" }
          - label: "当前方向"
            name: "directions"
            label_singular: "方向"
            widget: "list"
            min: 1
            max: 4
            summary: "{{fields.title}} · {{fields.status}} · 复核 {{fields.updated}}"
            fields:
              - { label: "方向", name: "title", widget: "string" }
              - { label: "正在验证", name: "question", widget: "text", hint: "写清楚当前希望验证的判断，而不是泛泛描述任务。" }
              - label: "状态"
                name: "status"
                widget: "select"
                options:
                  - "进行中"
                  - "调整中"
                  - "暂停"
              - { label: "下一检查点", name: "checkpoint", widget: "text", hint: "写明触发复核的事件，以及到时需要继续、修改还是暂停什么。" }
              - { label: "最近复核", name: "updated", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false, hint: "人工复核后更新；不会随构建自动变化。" }
          - { label: "页面说明", name: "body", widget: "markdown", required: false }

  - name: "weight"
    label: "体重记录"
    files:
      - name: "weight_log"
        label: "每周体重"
        file: "data/weight.yaml"
        fields:
          - label: "每周记录"
            name: "entries"
            label_singular: "一周"
            widget: "list"
            summary: "{{fields.date}} · {{fields.weight}}kg · BMI {{fields.bmi}}"
            fields:
              - { label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
              - { label: "体重(kg)", name: "weight", widget: "number", value_type: "float", step: 0.1 }
              - { label: "BMI", name: "bmi", widget: "number", value_type: "float", step: 0.1 }

  - name: "works"
    label: "作品集"
    description: "保存草稿会创建PR；等待validate通过并完成公开边界复核后再发布。"
    folder: "content/works"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "完成日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "摘要", name: "description", widget: "text" }
      - label: "作品类型"
        name: "work_type"
        widget: "select"
        options:
          - { label: "投资研究", value: "investment" }
          - { label: "工具产品", value: "tools" }
          - { label: "方法论", value: "methodology" }
          - { label: "身体实践", value: "body" }
      - { label: "阶段", name: "stage", widget: "string", default: "V1 · 已完成" }
      - { label: "要解决的问题", name: "problem", widget: "text", hint: "说明真实问题，不写泛泛愿景。", required: false }
      - { label: "待验证的假设", name: "hypothesis", widget: "text", hint: "开始前认为哪项改变会解决问题？", required: false }
      - { label: "约束与边界", name: "constraints", widget: "text", hint: "记录时间、成本、隐私和功能边界。", required: false }
      - { label: "关键决策", name: "decision", widget: "text", hint: "说明做了什么取舍，以及为何这样选择。", required: false }
      - { label: "阶段结果", name: "outcome", widget: "text" }
      - { label: "成品链接", name: "artifact_url", widget: "string", required: false }
      - { label: "源码或补充链接", name: "source_url", widget: "string", required: false }
      - { label: "验证证据", name: "evidence", widget: "text" }
      - { label: "限制与不足", name: "limitations", widget: "text" }
      - { label: "下一步判断", name: "next_step", widget: "text", hint: "明确继续、调整或停止的依据。", required: false }
      - label: "发布后带回的反馈与认知"
        name: "follow_ups"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.date}} · {{fields.note}}"
        hint: "只记录发布以后真实发生的反馈、判断修正或新认知；没有就留空。"
        fields:
          - { label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
          - { label: "带回了什么", name: "note", widget: "text" }
      - label: "后来复用到"
        name: "reused_in"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.title}}"
        hint: "记录这项成果后来在哪里被再次调用，以及它具体降低了什么成本；没有就留空。"
        fields:
          - { label: "项目或场景", name: "title", widget: "string" }
          - { label: "复用了什么", name: "note", widget: "text" }
          - { label: "相关链接", name: "url", widget: "string", required: false }
      - label: "公开边界"
        name: "disclosure"
        widget: "select"
        options:
          - { label: "完整公开", value: "public" }
          - { label: "匿名处理", value: "anonymized" }
          - { label: "延迟公开", value: "delayed" }
        default: "public"
      - label: "投资隐私复核完成"
        name: "privacy_reviewed"
        widget: "select"
        required: false
        options:
          - { label: "已完成", value: "true" }
        hint: "投资作品发布前必须开启：确认未公开金额、仓位、账户总收益；具体标的已达到阶段复盘或完全退出的公开时点。"
      - label: "具体标的公开依据"
        name: "security_disclosure_basis"
        widget: "select"
        required: false
        options:
          - { label: "未公开具体标的", value: "not_named" }
          - { label: "已达到公开边界", value: "boundary_met" }
        hint: "投资作品必填。达到公开边界指已经进入阶段复盘，或已经完全退出；无需公开具体属于哪一种。"
      - { label: "首页精选", name: "featured", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "english_posts"
    label: "English translations / 英文译文"
    description: "编辑现有英文译文。原文变化后需校对并记录同步版本，详见 docs/bilingual-site.md。"
    folder: "content_en/posts"
    create: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Date", name: "date", widget: "hidden" }
      - { label: "Slug", name: "slug", widget: "hidden" }
      - { label: "Categories", name: "categories", widget: "hidden" }
      - { label: "Tags", name: "tags", widget: "hidden", required: false }
      - { label: "Source version", name: "translation_source_hash", widget: "hidden" }
      - { label: "Translation provider", name: "translation_provider", widget: "hidden", required: false }
      - label: "Review status / 审校状态"
        name: "translation_status"
        widget: "select"
        options:
          - { label: "Machine translation / 机器初译", value: "machine" }
          - { label: "Reviewed / 已逐篇审校", value: "reviewed" }
      - { label: "Body", name: "body", widget: "markdown" }
