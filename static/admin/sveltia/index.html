<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>mantou 内容工作台</title>
    <link href="/admin/config.yml" type="application/yaml" rel="cms-config-url" />
    <link href="/admin/sveltia/config.yml" type="application/yaml" rel="cms-config-url" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #cms-loading,
      #cms-error {
        box-sizing: border-box;
        max-width: 42rem;
        padding: 1rem;
        line-height: 1.6;
      }

      #cms-loading {
        color: #444;
      }

      #cms-error {
        display: none;
        color: #b00020;
      }

      code {
        padding: 0.125rem 0.25rem;
        border-radius: 0.25rem;
        background: #f3f4f6;
      }
    </style>
  </head>
  <body>
    <div id="cms-loading" role="status">正在加载 mantou 内容工作台……</div>
    <div id="cms-error" role="alert">
      Sveltia CMS 脚本加载失败。请检查网络、广告拦截器，或确认
      <code>unpkg.com</code> 与 <code>cdn.jsdelivr.net</code> 可以访问。原后台仍可从
      <a href="/admin/">/admin/</a> 打开。
    </div>

    <script>
      (function loadCMS() {
        var loading = document.getElementById('cms-loading');
        var error = document.getElementById('cms-error');
        var integrity = 'sha384-fue7kFAg94Qs3xB6zYD5VeYJyw99klOSaHkOuTXQg888TMyBgMN6PyO+TxyASS+S';

        function done() {
          if (loading) loading.style.display = 'none';
        }

        function fail() {
          if (loading) loading.style.display = 'none';
          if (error) error.style.display = 'block';
        }

        function appendScript(src, sri, onload, onerror) {
          var script = document.createElement('script');
          script.src = src;
          script.integrity = sri;
          script.crossOrigin = 'anonymous';
          script.onload = onload;
          script.onerror = onerror;
          document.body.appendChild(script);
        }

        appendScript(
          'https://unpkg.com/@sveltia/cms@0.203.2/dist/sveltia-cms.js',
          integrity,
          done,
          function () {
            appendScript(
              'https://cdn.jsdelivr.net/npm/@sveltia/cms@0.203.2/dist/sveltia-cms.js',
              integrity,
              done,
              fail
            );
          }
        );
      })();
    </script>
  </body>
</html>
