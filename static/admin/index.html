<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Content Manager</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; }
      #cms-loading { padding: 16px; color: #444; }
      #cms-error { display: none; padding: 16px; color: #b00020; line-height: 1.6; }
      code { background: #f6f8fa; padding: 2px 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="cms-loading">Loading Decap CMS...</div>
    <div id="cms-error">
      Decap CMS 脚本加载失败。请先关闭广告拦截插件，或检查网络是否拦截 CDN：
      <code>unpkg.com</code> / <code>cdn.jsdelivr.net</code>。
    </div>

    <script>
      (function loadCMS() {
        var loading = document.getElementById('cms-loading');
        var error = document.getElementById('cms-error');

        var hooksRegistered = false;

        function normalizeDate(value) {
          if (!value) return '';

          var raw = String(value);
          var direct = raw.match(/^(\d{4}-\d{2}-\d{2})/);
          if (direct) return direct[1];

          var parsed = value instanceof Date ? value : new Date(value);
          if (Number.isNaN(parsed.getTime())) return '';

          var year = parsed.getFullYear();
          var month = String(parsed.getMonth() + 1).padStart(2, '0');
          var day = String(parsed.getDate()).padStart(2, '0');
          return year + '-' + month + '-' + day;
        }

        function registerCMSHooks() {
          if (
            hooksRegistered ||
            !window.CMS ||
            typeof window.CMS.registerEventListener !== 'function'
          ) {
            return;
          }

          hooksRegistered = true;
          window.CMS.registerEventListener({
            name: 'preSave',
            handler: function ({ entry }) {
              var data = entry && entry.get('data');
              if (!data) return data;

              // Existing entries keep their historical aliases untouched.
              // New posts get the predictable pre-shortlink URL automatically.
              if (
                entry.get('collection') !== 'posts' ||
                entry.get('isModification')
              ) {
                return data;
              }

              var date = normalizeDate(data.get('date'));
              var slug = String(data.get('slug') || '').trim();
              if (
                !/^\d{4}-\d{2}-\d{2}$/.test(date) ||
                !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)
              ) {
                return data;
              }

              var legacyAlias = '/posts/' + date + '-' + slug + '/';
              var existing = data.get('aliases');
              var aliases = [];

              if (existing && typeof existing.toJS === 'function') {
                aliases = existing.toJS();
              } else if (Array.isArray(existing)) {
                aliases = existing.slice();
              } else if (typeof existing === 'string' && existing.trim()) {
                aliases = [existing.trim()];
              }

              if (!Array.isArray(aliases)) aliases = [];
              if (aliases.indexOf(legacyAlias) === -1) {
                aliases.push(legacyAlias);
              }

              return data.set('aliases', aliases);
            },
          });
        }

        function done() {
          registerCMSHooks();
          if (loading) loading.style.display = 'none';
        }

        function fail() {
          if (loading) loading.style.display = 'none';
          if (error) error.style.display = 'block';
        }

        function appendScript(src, integrity, onload, onerror) {
          var script = document.createElement('script');
          script.src = src;
          script.integrity = integrity;
          script.crossOrigin = 'anonymous';
          script.onload = onload;
          script.onerror = onerror;
          document.body.appendChild(script);
        }

        appendScript(
          'https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js',
          'sha384-in6eHztHveqQ7uMZ1fDaKlDmacQLFuLH2wWrFTiymyuS8zQ5bixwL8U3AeRi8h/L',
          done,
          function () {
            appendScript(
              'https://cdn.jsdelivr.net/npm/decap-cms@3.15.1/dist/decap-cms.js',
              'sha384-in6eHztHveqQ7uMZ1fDaKlDmacQLFuLH2wWrFTiymyuS8zQ5bixwL8U3AeRi8h/L',
              done,
              fail
            );
          }
        );
      })();
    </script>
  </body>
</html>
