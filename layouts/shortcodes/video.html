{{- $src := .Get "src" -}}
{{- if not $src -}}
  {{- errorf "video shortcode requires a src parameter: %s" .Position -}}
{{- end -}}
{{- $title := .Get "title" | default "文章视频" -}}
<div class="responsive-video">
  <video controls preload="metadata" aria-label="{{ $title }}">
    <source src="{{ $src | safeURL }}" type="{{ .Get "type" | default "video/mp4" }}">
    您的浏览器不支持 HTML5 视频，可<a href="{{ $src | safeURL }}">直接下载观看</a>。
  </video>
</div>
