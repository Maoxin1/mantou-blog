{{- define "title" -}}{{ .Title }} - {{ .Site.Title }}{{- end -}}

{{- define "content" -}}
<div class="page works-index" data-works-index>
    <header class="section-intro">
        <p class="section-kicker">PORTFOLIO</p>
        <h1>{{ .Title }}</h1>
        <p>{{ .Description }}</p>
        {{ with .Content }}<div class="section-intro__content">{{ . }}</div>{{ end }}
    </header>

    <div class="work-grid">
        {{- range .Pages.ByDate.Reverse -}}
            {{- partial "work-card.html" . -}}
        {{- end -}}
    </div>
</div>
{{- end -}}
