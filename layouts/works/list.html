{{- define "title" -}}{{ .Title }} - {{ .Site.Title }}{{- end -}}

{{- define "content" -}}
<div class="page works-index" data-works-index>
    <header class="works-index__intro">
        <p class="works-index__eyebrow">做过的事</p>
        <h1>作品集</h1>
        <p>这里有身体实践、手机工具和 AI 工作流。每件作品都留下了成品或过程记录，也留下了当时没解决的问题。</p>
    </header>

    <div class="work-grid works-index__list">
        {{- range .Pages.ByDate.Reverse -}}
            {{- partial "work-card.html" . -}}
        {{- end -}}
    </div>
</div>
{{- end -}}
