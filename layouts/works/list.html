{{- define "title" -}}{{ .Title }} - {{ .Site.Title }}{{- end -}}

{{- define "content" -}}
<div class="page works-index" data-works-index>
    <header class="works-index__intro">
        <p class="works-index__eyebrow">{{ T "madeThings" }}</p>
        <h1>{{ T "projects" }}</h1>
        <p>{{ T "projectsIntro" }}</p>
    </header>

    <div class="work-grid works-index__list">
        {{- range .Pages.ByDate.Reverse -}}
            {{- partial "work-card.html" . -}}
        {{- end -}}
    </div>
</div>
{{- end -}}
