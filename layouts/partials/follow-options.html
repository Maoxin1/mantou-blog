{{- $feed := "index.xml" | absLangURL -}}
<div class="follow-options" aria-label="{{ T "rssWays" }}">
    <a class="follow-option follow-option--primary" href="https://www.inoreader.com/?add_feed={{ $feed | urlquery }}" target="_blank" rel="noopener">
        <span>{{ T "inoreader" }}</span>
        <small>{{ T "addReader" }}</small>
    </a>
    <a class="follow-option" href="https://feedly.com/i/subscription/feed/{{ $feed | urlquery }}" target="_blank" rel="noopener">
        <span>{{ T "feedly" }}</span>
        <small>{{ T "addReader" }}</small>
    </a>
    <button class="follow-option" type="button" data-copy-success="{{ T "copiedFeed" }}" data-copy-prompt="{{ T "copyPrompt" }}" data-copy-feed data-feed-url="{{ $feed }}">
        <span data-copy-feed-label>{{ T "copyFeed" }}</span>
        <small>{{ T "pasteReader" }}</small>
    </button>
    <a class="follow-option" href="{{ $feed }}" target="_blank" rel="noopener">
        <span>{{ T "rawFeed" }}</span>
        <small>{{ $feed }}</small>
    </a>
</div>
