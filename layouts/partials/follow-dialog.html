<dialog class="follow-dialog" data-follow-dialog aria-labelledby="follow-dialog-title" aria-describedby="follow-dialog-description">
    <div class="follow-dialog__panel">
        <button class="follow-dialog__close" type="button" data-follow-close aria-label="{{ T "closeFollow" }}">×</button>
        <p class="section-kicker">FOLLOW MANTOU</p>
        <h2 id="follow-dialog-title">{{ T "followMantou" }}</h2>
        <p class="follow-dialog__lead" id="follow-dialog-description">{{ T "followLead" }}</p>
        {{- partial "follow-form.html" (dict "Site" .Site "FieldID" "follow-email-dialog") -}}
        <div class="follow-dialog__divider"><span>{{ T "rssFollow" }}</span></div>
        {{- partial "follow-options.html" . -}}
        <p class="follow-dialog__footnote">{{ T "rssOpen" }}</p>
    </div>
</dialog>
