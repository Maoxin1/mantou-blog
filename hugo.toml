title = "mantou の blog"
baseURL = "https://mantou-blog.pages.dev/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
timeZone = "Asia/Shanghai"
# 未来日期只作为草稿保护；需要定时发布时使用 publishDate。
buildFuture = false

[languages.zh-cn]
  languageCode = "zh-cn"
  languageName = "中文"
  contentDir = "content"
  weight = 1
[languages.en]
  languageCode = "en"
  languageName = "English"
  contentDir = "content_en"
  hasCJKLanguage = false
  title = "mantou's blog"
  weight = 2
  [languages.en.params]
    description = "Notes on life, reading, personal experiments, and small tools by mantou."
  [[languages.en.menu.main]]
    identifier = "articles"
    name = "Writing"
    url = "/posts/"
    weight = 1
  [[languages.en.menu.main]]
    identifier = "portfolio"
    name = "Projects"
    url = "/works/"
    weight = 2
  [[languages.en.menu.main]]
    identifier = "now"
    name = "Now"
    url = "/now/"
    weight = 3
  [[languages.en.menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 4
  [[languages.en.menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 5
  [[languages.en.menu.main]]
    identifier = "follow"
    name = "Subscribe"
    url = "/follow/"
    weight = 6

# 显式挂载 vendored 主题，以免把当前未启用的数学和图库字体复制到生产包。
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/images"
    target = "assets/blog-media"
  [[module.imports]]
    path = "LoveIt-0.3.0"
    [[module.imports.mounts]]
      source = "archetypes"
      target = "archetypes"
    [[module.imports.mounts]]
      source = "assets"
      target = "assets"
    [[module.imports.mounts]]
      source = "i18n"
      target = "i18n"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
    [[module.imports.mounts]]
      source = "static"
      target = "static"
      files = ["! lib/katex/**", "! lib/lightgallery/**", "! lib/lazysizes/**", "**"]

# 文章永久地址与中文标题解耦，便于在聊天软件中分享。
[permalinks]
  posts = "/p/:slug/"

[social]
  twitter = "mantouaoao"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "mantou 的个人博客：日记、阅读、身体实践和自己做的小工具。"

# 页面没有 featured image 时使用的稳定站点级分享图（约 1.91:1，适配常见社交卡片）。
[params.seo]
  image = "/images/mantou-social.jpg"

# 网站左上角显示的站点名（覆盖主题默认的 "My cool site"）
[params.header.title]
  name = "mantou"

[params.author]
  enable = true
  name = "mantou"
  avatar = "/images/mantou.jpg"
  link = "https://github.com/Maoxin1"

[params.social]
  Email = "2114206091@qq.com"
  twitter = "mantouaoao"

# 已停用主题内置统计。Cloudflare 负责现有访问量与性能；填入 Umami 的公开
# Website ID 后启用匿名行为漏斗。两个脚本仅在正式域名加载。
[params.analytics]
  enable = false
  umamiWebsiteID = ""

[params.app]
  # 使用 static/ 下生成的标准图标集（favicon.ico / 32 / 16 / apple-touch-icon / site.webmanifest）
  # 不再用照片当 favicon
  title = "mantou の blog"  # 加到主屏/启动器时的应用名（覆盖主题默认的 "My cool site"）
  iconColor = ""  # 置空以禁用主题默认的 mask-icon（safari-pinned-tab.svg 不存在，避免 404）

[params.page]
  # 暂不加载 lightGallery：当前博客不依赖图库交互，避免无效生产许可证提示和冗余前端资源。
  lightgallery = false

# 关注入口：follow.it 从本站 RSS 自动读取新文章并发送邮箱提醒。
# 此处仅保存公开的订阅表单地址，不包含账户凭据或 API 密钥。
[params.follow]
  followitAction = "https://api.follow.it/subscription-form/eVdkdTJYM2plUTN1UzFvVkdnUlFsVHRkclJVWTBhQXJZSHllNW5kb3RJbUtSbEI1UWN4bkp0SE1MUDBFbWFFY0RFU2g2WUh0cmtUV2l6VzlOdC9KRThIWDFlUFh3K2JLcVhRdWNRL3RiMVR2MG44YWF6RE5qb0hFbkwvVWcveHl8WVFZQzNaaXhxRm95bzArY3VVVzVlTDB0MUtkTy9keWpFN1k4N3R3RWhmRT0=/8"

# 邮件反馈始终可用。完成 Waline 服务部署与真实收发验收后，再填入公开 HTTPS 地址。
# 留空时不展示点赞计数或评论表单，也不向第三方发送访客数据。
[params.feedback]
  serverURL = ""

# 站内搜索改用 Pagefind（页面见 /search/，需配套 Cloudflare 构建命令）；停用主题自带 Lunr
[params.search]
  enable = false

# 关闭主题默认的 jsdelivr CDN，改用本地打包的库文件
# （jsdelivr 在中国大陆常被墙，会导致 lunr 搜索核心、FontAwesome 等加载失败）
[params.cdn]
  data = ""

