name: Audit Bible citation sources

on:
  push:
    branches: [chore/jw-bible-source-audit-20260927]
    paths: [.github/workflows/jw-bible-source-audit.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public jw.org scripture links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          import urllib.request, urllib.parse, json, re
          out = Path('/tmp/jw-links')
          out.mkdir()
          items = [(lang, verse) for lang in ('CHS', 'E') for verse in ('46003006', '21003002', '40025029', '23041010')]
          def check(item):
              lang, verse = item
              url = 'https://www.jw.org/finder?' + urllib.parse.urlencode({'wtlocale': lang, 'pub': 'nwtsty', 'bible': verse})
              result = {'locale': lang, 'verse': verse, 'request_url': url}
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 BibleCitationLinkCheck/1.0'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      html = response.read().decode('utf-8')
                      result.update({'status': response.status, 'resolved_url': response.url})
                      result['title'] = re.findall(r'<title>(.*?)</title>', html, re.S)
                      result['verse_anchor_present'] = f'v{verse}' in html
                      (out / f'{lang}-{verse}.html').write_text(html, encoding='utf-8')
              except Exception as exc:
                  result['error'] = str(exc)
              return result
          with ThreadPoolExecutor(max_workers=8) as pool:
              results = list(pool.map(check, items))
          (out / 'links.json').write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(results, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-jw-links
          path: /tmp/jw-links/
          retention-days: 1
