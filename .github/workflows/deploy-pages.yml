name: Deploy Pages

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit SHA to publish as the manual preview
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: >-
    deploy-pages-${{
      github.event_name == 'workflow_run' && 'production' || 'manual-preview'
    }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit_sha: ${{ steps.source.outputs.commit_sha }}
      deploy_branch: ${{ steps.source.outputs.deploy_branch }}
    steps:
      - name: Check out the exact source without deployment credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.head_sha ||
              inputs.source_ref
            }}

      - name: Record immutable source and deployment target
        id: source
        env:
          DEPLOY_BRANCH: >-
            ${{ github.event_name == 'workflow_run' && 'main' || 'manual-preview' }}
        run: |
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "deploy_branch=$DEPLOY_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Set up Hugo
        env:
          HUGO_VERSION: "0.154.5"
        run: |
          cd "$(mktemp -d)"
          asset="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          base_url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --silent --show-error --location --remote-name "${base_url}/${asset}"
          curl --fail --silent --show-error --location --remote-name "${base_url}/hugo_${HUGO_VERSION}_checksums.txt"
          grep "  ${asset}$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum --check -
          sudo tar --extract --gzip --file "${asset}" --directory /usr/local/bin hugo
          hugo version

      - name: Install pinned dependencies
        run: npm ci

      - name: Install validation dependencies for manual preview
        if: github.event_name == 'workflow_dispatch'
        run: >-
          python -m pip install --disable-pip-version-check
          -r scripts/requirements-validation.txt
          -r scripts/requirements-image.txt

      - name: Validate manual-preview source
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scripts/validate_admin_config.py
          python scripts/validate_posts.py
          python scripts/validate_portfolio.py
          python -m unittest discover -s tests/python -p "test_*.py"

      - name: Build production site
        run: hugo --minify --panicOnWarning --cleanDestinationDir

      - name: Build Pagefind search index
        run: npx --yes pagefind@1.5.2 --site public

      - name: Validate generated output
        run: |
          python scripts/check_internal_links.py
          python scripts/check_short_post_urls.py
          python scripts/check_portfolio_output.py

      - name: Install Playwright Chromium for manual preview
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium

      - name: Validate manual preview in a real browser
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:e2e

      - name: Package the credential-free site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-site-${{ github.run_id }}
          path: public/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pages-deploy
    steps:
      - name: Check out immutable trusted deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.head_sha ||
              github.sha
            }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned deployment tooling
        run: npm ci

      - name: Download the verified site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pages-site-${{ github.run_id }}
          path: public/

      - name: Deploy verified artifact to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 60fce3c87fe0af3ac0a66d4b03594598
          DEPLOY_BRANCH: ${{ needs.build.outputs.deploy_branch }}
          DEPLOY_COMMIT: ${{ needs.build.outputs.commit_sha }}
        run: >-
          npx wrangler pages deploy public
          --project-name=mantou-blog
          --branch="$DEPLOY_BRANCH"
          --commit-hash="$DEPLOY_COMMIT"
