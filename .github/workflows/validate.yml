name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Set up Hugo
        env:
          HUGO_VERSION: "0.154.5"
        run: |
          cd "$(mktemp -d)"
          asset="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          base_url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --silent --show-error --location --remote-name "${base_url}/${asset}"
          curl --fail --silent --show-error --location --remote-name "${base_url}/hugo_${HUGO_VERSION}_checksums.txt"
          grep "  ${asset}$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum --check -
          sudo tar --extract --gzip --file "${asset}" --directory /usr/local/bin hugo
          hugo version

      - name: Install browser test dependencies
        run: npm ci

      - name: Audit Node.js dependencies
        run: npm audit --audit-level=high

      - name: Install vendored theme dependencies
        run: npm ci --ignore-scripts --prefix themes/LoveIt-0.3.0

      - name: Audit vendored theme dependencies
        run: npm audit --prefix themes/LoveIt-0.3.0 --audit-level=high

      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r scripts/requirements-validation.txt
          -r scripts/requirements-image.txt

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate Decap CMS admin config
        run: python scripts/validate_admin_config.py

      - name: Validate post metadata and local images
        run: python scripts/validate_posts.py

      - name: Validate structured portfolio entries
        run: python scripts/validate_portfolio.py

      - name: Test portfolio privacy preflight
        run: python -m unittest discover -s tests/python -p "test_*.py"

      - name: Build production site
        run: hugo --minify --panicOnWarning --cleanDestinationDir

      - name: Build Pagefind search index
        run: npx --yes pagefind@1.5.2 --site public

      - name: Validate production runtime assets
        run: python scripts/check_runtime_assets.py

      - name: Validate generated internal links
        run: python scripts/check_internal_links.py

      - name: Validate short post URLs and legacy redirects
        run: python scripts/check_short_post_urls.py

      - name: Validate portfolio visitor journey
        run: python scripts/check_portfolio_output.py

      - name: Validate generated SEO metadata
        run: python scripts/check_seo_output.py

      - name: Validate portfolio in a real browser
        run: npm run test:e2e
