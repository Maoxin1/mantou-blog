name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@6e295a6a0c9087bf374299e9d67f9d2edab9f18f # v3.0.0
        with:
          hugo-version: "0.154.5"
          extended: true

      - name: Install browser test dependencies
        run: npm ci

      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r scripts/requirements-validation.txt
          -r scripts/requirements-image.txt

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate Decap CMS admin config
        run: python scripts/validate_admin_config.py

      - name: Validate post filenames vs front-matter dates
        run: python scripts/validate_posts.py

      - name: Validate structured portfolio entries
        run: python scripts/validate_portfolio.py

      - name: Test portfolio privacy preflight
        run: python -m unittest discover -s tests/python -p "test_*.py"

      - name: Build production site
        run: hugo --minify --panicOnWarning --cleanDestinationDir

      - name: Build Pagefind search index
        run: npx --yes pagefind@1.5.2 --site public

      - name: Validate generated internal links
        run: python scripts/check_internal_links.py

      - name: Validate portfolio visitor journey
        run: python scripts/check_portfolio_output.py

      - name: Validate portfolio in a real browser
        run: npm run test:e2e
